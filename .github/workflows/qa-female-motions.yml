name: QA Female HD Motions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-female-motions.yml'

permissions:
  contents: read
  actions: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Prepare browser QA
        shell: bash
        run: npm install --no-save puppeteer-core
      - name: Run motion screenshots
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          cat > qa.mjs <<'NODE'
          import puppeteer from 'puppeteer-core'
          import fs from 'node:fs'
          const browser=await puppeteer.launch({
            executablePath:process.env.CHROME_PATH,
            headless:true,
            args:['--no-sandbox','--disable-gpu','--window-size=1600,1000']
          })
          const page=await browser.newPage()
          await page.setViewport({width:1600,height:1000,deviceScaleFactor:1})
          await page.goto('https://home-workout-cg-maker-production.up.railway.app/?motionqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000})
          await page.waitForSelector('canvas',{timeout:30000})\n          await new Promise(r=>setTimeout(r,7000))
          const allButtons=await page.$$eval('button',bs=>bs.map(b=>b.textContent?.trim()).filter(Boolean))
          fs.writeFileSync('button-texts.json',JSON.stringify(allButtons,null,2))
          async function clickMotion(name){
            const result=await page.evaluate((name)=>{
              const els=[...document.querySelectorAll('button')]
              const exact=els.find(b=>(b.textContent||'').trim()===name)
              const loose=els.find(b=>(b.textContent||'').includes(name))
              const el=exact||loose
              if(!el)return {ok:false}
              el.scrollIntoView({block:'center'})
              el.click()
              return {ok:true,text:(el.textContent||'').trim()}
            },name)
            if(!result.ok) throw new Error('Motion button not found: '+name)
            await new Promise(r=>setTimeout(r,800))
            await page.evaluate(()=>window.scrollTo(0,0))
            await new Promise(r=>setTimeout(r,500))
            await page.screenshot({path:`qa-${name}-a.png`,fullPage:false})
            await new Promise(r=>setTimeout(r,1400))
            await page.screenshot({path:`qa-${name}-b.png`,fullPage:false})
            return result
          }
          const results={}
          for(const name of ['스쿼트','힙브리지','버드독']) results[name]=await clickMotion(name)
          fs.writeFileSync('motion-results.json',JSON.stringify(results,null,2))
          await browser.close()
          NODE
          node qa.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: female-hd-motion-qa
          path: |
            qa-*.png
            button-texts.json
            motion-results.json
          if-no-files-found: error
          retention-days: 7
